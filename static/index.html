<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortlist · Resume Matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee;
    --surface: #fffdf9;
    --surface-2: #f0ebe3;
    --ink: #1c1a17;
    --ink-2: #5c574f;
    --ink-3: #8f887d;
    --line: #e3ddd2;
    --accent: #1f6f5c;
    --accent-soft: #dcefe8;
    --warn: #b4532a;
    --warn-soft: #f8e4d9;
    --mid: #b98a1b;
    --mid-soft: #f6ecd2;
    --shadow: 0 1px 2px rgba(40, 30, 10, .04), 0 8px 24px -12px rgba(40, 30, 10, .12);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311;
      --surface: #1c1b18;
      --surface-2: #262420;
      --ink: #f1ece4;
      --ink-2: #b8b1a5;
      --ink-3: #7f786d;
      --line: #322f2a;
      --accent: #5cc4a6;
      --accent-soft: #1b3a32;
      --warn: #ec8d64;
      --warn-soft: #43271b;
      --mid: #e2b44a;
      --mid-soft: #3d321a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  header { padding: 40px 0 28px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
  .brand .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--surface); }
  h1 {
    font-family: "Fraunces", serif; font-weight: 500;
    font-size: clamp(34px, 5vw, 54px); line-height: 1.05; letter-spacing: -.02em;
    margin: 28px 0 12px; max-width: 14ch;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .lede { color: var(--ink-2); max-width: 56ch; margin: 0; font-size: 16px; }

  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; margin-top: 32px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .step { font: 500 12px "Geist Mono", monospace; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
  h2 { font-size: 17px; font-weight: 600; margin: 2px 0 0; letter-spacing: -.01em; }

  textarea {
    width: 100%; min-height: 300px; resize: vertical;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid transparent; border-radius: 12px;
    padding: 14px; font: 13.5px/1.6 "Geist", sans-serif;
    transition: border-color .15s, background .15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }

  .link-btn { background: none; border: 0; color: var(--ink-3); font: inherit; font-size: 13px; cursor: pointer; padding: 0; }
  .link-btn:hover { color: var(--ink); }

  .drop {
    border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 34px 16px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop svg { color: var(--accent); }
  .drop strong { display: block; margin-top: 8px; font-weight: 600; }
  .drop span { color: var(--ink-3); font-size: 13px; }

  .files { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; max-height: 214px; overflow: auto; }
  .files li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; background: var(--surface-2); border-radius: 10px; font-size: 13.5px;
  }
  .files .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .status { font: 500 11.5px "Geist Mono", monospace; color: var(--ink-3); white-space: nowrap; }
  .files .status.done { color: var(--accent); }
  .files .status.error { color: var(--warn); }
  .files .remove { background: none; border: 0; color: var(--ink-3); cursor: pointer; font-size: 17px; line-height: 1; padding: 0 2px; }
  .files .remove:hover { color: var(--warn); }
  .spinner { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .go {
    width: 100%; margin-top: 18px; padding: 14px;
    background: var(--ink); color: var(--bg);
    border: 0; border-radius: 12px; font: 600 15px "Geist", sans-serif;
    cursor: pointer; transition: transform .1s, opacity .15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .go:hover:not(:disabled) { transform: translateY(-1px); }
  .go:disabled { opacity: .4; cursor: not-allowed; }
  .progress { height: 3px; background: var(--line); border-radius: 3px; margin-top: 12px; overflow: hidden; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .hint { color: var(--ink-3); font-size: 12.5px; margin: 10px 0 0; text-align: center; min-height: 1em; }

  .error-banner { margin-top: 20px; padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); display: none; }

  /* Job summary */
  #job-summary { margin-top: 20px; display: none; }
  .job-row { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; }
  .job-role { font-family: "Fraunces", serif; font-size: 24px; font-weight: 500; letter-spacing: -.01em; margin: 4px 0 12px; }
  .meta { display: flex; gap: 22px; flex-wrap: wrap; }
  .meta div { font-size: 13px; color: var(--ink-3); }
  .meta b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 12.5px; background: var(--surface-2); color: var(--ink-2); }
  .chip.yes { background: var(--accent-soft); color: var(--accent); }
  .chip.no { background: var(--warn-soft); color: var(--warn); }
  .label { font: 500 11.5px "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 16px 0 8px; }

  /* Results */
  #results { margin: 36px 0 80px; display: none; }
  .results-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .results-head h2 { font-family: "Fraunces", serif; font-size: 30px; font-weight: 500; letter-spacing: -.02em; }
  .stats { display: flex; gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; min-width: 96px; }
  .stat small { display: block; color: var(--ink-3); font-size: 12px; }
  .stat b { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }

  .cand {
    display: grid; grid-template-columns: 40px 1fr 92px; gap: 18px; align-items: start;
    margin-bottom: 12px; animation: rise .4s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (max-width: 640px) { .cand { grid-template-columns: 1fr 72px; } .rank { display: none; } }
  .rank { font: 500 28px "Fraunces", serif; color: var(--ink-3); line-height: 1; padding-top: 6px; }
  .cand-name { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font: 500 11px "Geist Mono", monospace; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .tag.top { background: var(--accent-soft); color: var(--accent); }
  .tag.low { background: var(--warn-soft); color: var(--warn); }
  .contact { color: var(--ink-3); font-size: 13px; margin: 2px 0 0; word-break: break-word; }
  .verdict { margin: 12px 0 0; color: var(--ink-2); font-size: 14.5px; }
  .exp { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 10px; color: var(--ink-2); }
  .exp i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .exp.ok i { background: var(--accent); }
  .exp.bad i { background: var(--warn); }

  .ring { width: 92px; height: 92px; position: relative; }
  @media (max-width: 640px) { .ring { width: 72px; height: 72px; } }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .track { stroke: var(--surface-2); }
  .ring .val { stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 600 20px "Geist", sans-serif; letter-spacing: -.02em; }
  .ring span small { font-size: 11px; color: var(--ink-3); font-weight: 500; }

  details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; color: var(--ink-3); font-size: 13px; list-style: none; }
  summary::before { content: "+ "; }
  details[open] summary::before { content: "− "; }
  summary:hover { color: var(--ink); }
  .xp { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .xp b { font-weight: 600; }
  .xp span { color: var(--ink-3); font-size: 13px; }
  .plain { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }

  .failed { color: var(--warn); font-size: 14px; }
  footer { color: var(--ink-3); font-size: 12.5px; text-align: center; padding: 0 0 40px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="dot">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      Shortlist
    </div>
    <h1>Find the right fit, <em>faster.</em></h1>
    <p class="lede">Paste a job description, drop in a stack of resumes, and get every candidate parsed, scored and ranked against the role.</p>
  </header>

  <div class="grid">
    <section class="card">
      <div class="card-head">
        <div>
          <div class="step">Step 1</div>
          <h2>Job description</h2>
        </div>
        <button class="link-btn" id="clear-jd" type="button">Clear</button>
      </div>
      <textarea id="jd" placeholder="Paste the full job description here…"></textarea>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <div class="step">Step 2</div>
          <h2>Resumes</h2>
        </div>
        <button class="link-btn" id="clear-files" type="button">Remove all</button>
      </div>
      <label class="drop" id="drop">
        <input type="file" id="file-input" accept=".pdf,.docx" multiple hidden>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <strong>Drop resumes here</strong>
        <span>or click to browse · PDF or DOCX</span>
      </label>
      <ul class="files" id="files"></ul>
      <button class="go" id="go" disabled>Analyze candidates</button>
      <div class="progress" id="progress"><div></div></div>
      <p class="hint" id="hint"></p>
    </section>
  </div>

  <div class="error-banner" id="error"></div>

  <section class="card" id="job-summary"></section>

  <section id="results">
    <div class="results-head">
      <h2>Ranked candidates</h2>
      <div class="stats" id="stats"></div>
    </div>
    <div id="cand-list"></div>
  </section>
</div>
<footer>Powered by Groq · Scores are AI estimates, review before deciding.</footer>

<script>
const $ = (s) => document.querySelector(s);
const jdEl = $("#jd"), filesEl = $("#files"), goBtn = $("#go"), hintEl = $("#hint");
const progressEl = $("#progress"), errorEl = $("#error");

let queue = [];   // { file, status, error }
let results = []; // { filename, resume, match }
let busy = false;

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const chips = (items, cls = "") => items?.length
  ? `<div class="chips">${items.map((i) => `<span class="chip ${cls}">${esc(i)}</span>`).join("")}</div>`
  : `<span class="contact">None listed</span>`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

fetch("/api/default-job").then((r) => r.json()).then((d) => { if (!jdEl.value) jdEl.value = d.description; refresh(); });

$("#clear-jd").onclick = () => { jdEl.value = ""; jdEl.focus(); refresh(); };
$("#clear-files").onclick = () => { if (!busy) { queue = []; renderFiles(); } };
jdEl.oninput = refresh;

const drop = $("#drop"), input = $("#file-input");
input.onchange = () => { addFiles(input.files); input.value = ""; };
["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (ev) => addFiles(ev.dataTransfer.files));

function addFiles(list) {
  if (busy) return;
  for (const file of list) {
    if (!/\.(pdf|docx)$/i.test(file.name)) continue;
    if (queue.some((q) => q.file.name === file.name && q.file.size === file.size)) continue;
    queue.push({ file, status: "ready" });
  }
  renderFiles();
}

function renderFiles() {
  filesEl.innerHTML = queue.map((q, i) => {
    const status = {
      ready: "Ready",
      working: `<span class="spinner"></span>`,
      done: "✓ Scored",
      error: "Failed",
    }[q.status];
    return `<li title="${esc(q.error || q.file.name)}">
      <span class="fname">${esc(q.file.name)}</span>
      <span class="status ${q.status}">${status}</span>
      ${busy ? "" : `<button class="remove" data-i="${i}" aria-label="Remove">×</button>`}
    </li>`;
  }).join("");
  filesEl.querySelectorAll(".remove").forEach((b) => b.onclick = () => { queue.splice(+b.dataset.i, 1); renderFiles(); });
  refresh();
}

function refresh() {
  goBtn.disabled = busy || !queue.length || !jdEl.value.trim();
  if (!busy) hintEl.textContent = queue.length ? `${queue.length} resume${queue.length > 1 ? "s" : ""} ready` : "";
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = msg ? "block" : "none";
}

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
  return data;
}

goBtn.onclick = async () => {
  busy = true; results = []; showError("");
  queue.forEach((q) => { q.status = "ready"; q.error = null; });
  renderFiles();
  $("#results").style.display = "none";
  progressEl.style.display = "block";
  const total = queue.length + 1;
  const setProgress = (n) => progressEl.firstElementChild.style.width = `${(n / total) * 100}%`;
  setProgress(0.3);

  try {
    hintEl.textContent = "Reading the job description…";
    const job = await api("/api/job", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ description: jdEl.value }),
    });
    renderJob(job);
    setProgress(1);

    for (const [i, q] of queue.entries()) {
      q.status = "working"; renderFiles();
      hintEl.textContent = `Analyzing ${i + 1} of ${queue.length}: ${q.file.name}`;
      const form = new FormData();
      form.append("file", q.file);
      form.append("job", JSON.stringify(job));
      try {
        results.push(await api("/api/analyze", { method: "POST", body: form }));
        q.status = "done";
      } catch (err) {
        q.status = "error"; q.error = err.message;
        results.push({ filename: q.file.name, error: err.message });
      }
      renderFiles(); renderResults(); setProgress(i + 2);
      if (i < queue.length - 1) await sleep(1500); // be gentle with the API rate limit
    }
    const failed = queue.filter((q) => q.status === "error").length;
    hintEl.textContent = failed ? `Done · ${failed} file${failed > 1 ? "s" : ""} failed` : "All done";
  } catch (err) {
    showError(err.message);
    hintEl.textContent = "";
  } finally {
    busy = false;
    setTimeout(() => { progressEl.style.display = "none"; setProgress(0); }, 800);
    const doneMessage = hintEl.textContent;
    renderFiles();
    hintEl.textContent = doneMessage;
  }
};

function renderJob(job) {
  const el = $("#job-summary");
  el.style.display = "block";
  el.innerHTML = `
    <div class="step">Role requirements</div>
    <div class="job-role">${esc(job.role || "Untitled role")}</div>
    <div class="meta">
      <div><b>${job.minimum_experience != null ? esc(job.minimum_experience) + " yrs" : "Not specified"}</b>Min. experience</div>
      <div><b>${job.required_skills.length}</b>Required skills</div>
      <div><b>${job.preferred_skills.length}</b>Preferred skills</div>
    </div>
    <div class="label">Required</div>${chips(job.required_skills)}
    <div class="label">Preferred</div>${chips(job.preferred_skills)}`;
}

function ring(score) {
  const r = 38, c = 2 * Math.PI * r;
  const color = score >= 70 ? "var(--accent)" : score >= 45 ? "var(--mid)" : "var(--warn)";
  return `<div class="ring">
    <svg viewBox="0 0 92 92"><circle class="track" cx="46" cy="46" r="${r}"/>
      <circle class="val" cx="46" cy="46" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-target="${c * (1 - score / 100)}"/></svg>
    <span><div>${Math.round(score)}<small>%</small></div></span>
  </div>`;
}

function renderResults() {
  const ok = results.filter((r) => !r.error).sort((a, b) => b.match.score - a.match.score);
  const bad = results.filter((r) => r.error);
  $("#results").style.display = "block";

  const scores = ok.map((r) => r.match.score);
  $("#stats").innerHTML = ok.length ? `
    <div class="stat"><small>Candidates</small><b>${ok.length}</b></div>
    <div class="stat"><small>Top score</small><b>${Math.round(Math.max(...scores))}%</b></div>
    <div class="stat"><small>Average</small><b>${Math.round(scores.reduce((a, b) => a + b, 0) / scores.length)}%</b></div>` : "";

  // tag top 2 / bottom 2 without overlap when there are few candidates
  const half = Math.floor(ok.length / 2);
  const topN = Math.min(2, ok.length - half), lowN = Math.min(2, half);

  $("#cand-list").innerHTML = ok.map((r, i) => {
    const { resume: cv, match: m } = r;
    const tag = ok.length > 1 && i < topN ? `<span class="tag top">Top pick</span>`
      : ok.length > 1 && i >= ok.length - lowN ? `<span class="tag low">Lowest</span>` : "";
    const exp = m.experience_met === true ? ["ok", "Meets experience requirement"]
      : m.experience_met === false ? ["bad", "Below experience requirement"] : ["", "Experience unclear"];
    const contact = [cv.email, cv.phone, cv.total_experience_years != null ? `${cv.total_experience_years} yrs experience` : null].filter(Boolean);
    return `<article class="card cand">
      <div class="rank">${String(i + 1).padStart(2, "0")}</div>
      <div>
        <h3 class="cand-name">${esc(cv.name || m.candidate_name || r.filename)} ${tag}</h3>
        <p class="contact">${contact.map(esc).join(" · ") || esc(r.filename)}</p>
        ${m.verdict ? `<p class="verdict">${esc(m.verdict)}</p>` : ""}
        <div class="exp ${exp[0]}"><i></i>${exp[1]}</div>
        <div class="label">Matching skills</div>${chips(m.matching_skills, "yes")}
        <div class="label">Missing skills</div>${chips(m.missing_skills, "no")}
        <details>
          <summary>Full parsed resume</summary>
          ${cv.experiences.length ? `<div class="label">Experience</div><ul class="xp">${cv.experiences.map((x) =>
            `<li><b>${esc(x.role || "Role")}</b>${x.company ? ` · ${esc(x.company)}` : ""}<br><span>${esc(x.duration || "")}</span></li>`).join("")}</ul>` : ""}
          ${cv.education.length ? `<div class="label">Education</div><ul class="plain">${cv.education.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
          ${cv.projects.length ? `<div class="label">Projects</div><ul class="plain">${cv.projects.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
          ${cv.certifications.length ? `<div class="label">Certifications</div><ul class="plain">${cv.certifications.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
          <div class="label">All skills</div>${chips(cv.skills)}
        </details>
      </div>
      ${ring(m.score)}
    </article>`;
  }).join("") + bad.map((r) => `<article class="card cand">
      <div class="rank">—</div>
      <div><h3 class="cand-name">${esc(r.filename)}</h3><p class="failed">${esc(r.error)}</p></div><div></div>
    </article>`).join("");

  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelectorAll(".ring .val").forEach((c) => c.style.strokeDashoffset = c.dataset.target)));
}
</script>
</body>
</html>
